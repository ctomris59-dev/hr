name: FutureHR V1 Quality Gate

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate hardened lockfile
        if: startsWith(github.ref, 'refs/heads/feature/dependency-security-hardening')
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Apply Playwright compatibility fixes
        if: startsWith(github.ref, 'refs/heads/feature/dependency-security-hardening')
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("demo-inspector.spec.ts")
          text = p.read_text()
          text = text.replace(
              '  trainingAssignments: string | null;\n  leaveRequests: string | null;',
              '  trainingAssignments?: string | null;\n  leaveRequests?: string | null;'
          )
          old = '''  await page.waitForFunction(\n    (selector, count) => {\n      const el = document.querySelector(selector) as HTMLSelectElement | null;\n      return !!el && el.options.length >= count;\n    },\n    `[data-testid="${testId}"]`,\n    minCount\n  );'''
          new = '''  await page.waitForFunction(\n    ({ selector, count }) => {\n      const el = document.querySelector(selector) as HTMLSelectElement | null;\n      return !!el && el.options.length >= count;\n    },\n    { selector: `[data-testid="${testId}"]`, count: minCount }\n  );'''
          if old not in text:
              raise SystemExit("waitForFunction compatibility block not found")
          text = text.replace(old, new)
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json demo-inspector.spec.ts
          git diff --cached --quiet || git commit -m "Align tests with hardened dependencies"
          git push origin HEAD:feature/dependency-security-hardening
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit diagnostic
        run: npm audit --json || true
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: FutureHR V1 E2E
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: futurehr-playwright-report
          path: frontend/playwright-report
          retention-days: 7
