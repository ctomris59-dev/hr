name: FutureHR V1 Quality Gate

on:
  push:
    branches: ["main", "feature/**", "fhr-di-v2-final"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify hardened dependency graph
        run: npm ls axios jspdf next uuid tmp
      - name: Strict lint - SaaS server boundary and data client
        run: npm run lint:strict
      - name: Legacy lint debt report
        continue-on-error: true
        run: npm run lint
      - name: ExcelJS compatibility smoke test
        run: |
          node <<'NODE'
          const ExcelJS = require("exceljs");
          (async () => {
            const workbook = new ExcelJS.Workbook();
            const sheet = workbook.addWorksheet("SecuritySmoke");
            sheet.getCell("A1").value = "FutureHR";
            const buffer = await workbook.xlsx.writeBuffer();
            const restored = new ExcelJS.Workbook();
            await restored.xlsx.load(buffer);
            const value = restored.getWorksheet("SecuritySmoke")?.getCell("A1").value;
            if (value !== "FutureHR") throw new Error("ExcelJS secure override smoke test failed");
            console.log("ExcelJS secure override smoke test passed");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: FutureHR V1 E2E
        run: npm run test:e2e
      - name: Strict dependency security audit
        run: npm audit --audit-level=low
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: futurehr-playwright-report
          path: frontend/playwright-report
          retention-days: 7

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: futurehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile SaaS backend
        run: python -m compileall -q core db routers scripts
      - name: PostgreSQL migration smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/futurehr_test
          ENVIRONMENT: test
          APP_ENV: test
        run: alembic upgrade head
      - name: Backend security, tenant and decision intelligence tests
        env:
          ENVIRONMENT: test
          APP_ENV: test
        run: >-
          pytest -q
          tests/test_saas_security.py
          tests/test_production_readiness.py
          tests/test_employee_saas_api.py
          tests/test_saas_performance_talent.py
          tests/test_saas_workforce_ops.py
          tests/test_decision_intelligence_v2.py
          tests/test_recruitment_lifecycle_v2.py
          tests/test_integration_ingest_v1.py
          tests/unit/test_roles_permissions.py
          tests/integration/test_org_chart_endpoint.py
      - name: Build production backend image
        run: docker build -t futurehr-backend-ci .
      - name: Production container migration and health smoke test
        run: |
          set -o pipefail
          docker run -d --name futurehr-backend-ci --network host \
            -e PORT=8010 \
            -e ENVIRONMENT=production \
            -e APP_ENV=production \
            -e DEBUG=false \
            -e DATA_MODE=database \
            -e SAAS_AUTH_ENABLED=true \
            -e ALLOW_LEGACY_API_IN_SAAS=false \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/futurehr_test \
            -e SECRET_KEY=ci-production-secret-0123456789abcdefghijklmnopqrstuvwxyz \
            -e 'ALLOWED_HOSTS=["127.0.0.1","localhost"]' \
            -e 'CORS_ORIGINS=["https://hr-hibemotoru.vercel.app"]' \
            futurehr-backend-ci
          trap 'docker logs futurehr-backend-ci || true; docker rm -f futurehr-backend-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /tmp/futurehr-health.json http://127.0.0.1:8010/health; then
              cat /tmp/futurehr-health.json
              python - <<'PY'
          import json
          with open('/tmp/futurehr-health.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          assert payload['ready'] is True, payload
          assert payload['database_ok'] is True, payload
          assert payload['secure_auth_enabled'] is True, payload
          print('Production container health verified')
          PY
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx futurehr-backend-ci; then
              echo 'Backend container exited before becoming healthy' >&2
              docker logs futurehr-backend-ci || true
              exit 1
            fi
            sleep 2
          done
          echo 'Backend container did not become healthy' >&2
          docker logs futurehr-backend-ci || true
          exit 1
