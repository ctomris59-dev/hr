name: FutureHR V1 Quality Gate

on:
  push:
    branches: ["main", "feature/**", "fhr-di-v2-final"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Strict dependency security audit
        run: npm audit --audit-level=low
      - name: Verify hardened dependency graph
        run: npm ls axios jspdf next uuid tmp
      - name: Strict lint - SaaS server boundary and data client
        run: npx eslint lib/hr/saasWorkforceClient.ts lib/hr/decisionIntelligenceClient.ts app/api/saas
      - name: Legacy lint debt report
        continue-on-error: true
        run: npm run lint
      - name: ExcelJS compatibility smoke test
        run: |
          node <<'NODE'
          const ExcelJS = require("exceljs");
          (async () => {
            const workbook = new ExcelJS.Workbook();
            const sheet = workbook.addWorksheet("SecuritySmoke");
            sheet.getCell("A1").value = "FutureHR";
            const buffer = await workbook.xlsx.writeBuffer();
            const restored = new ExcelJS.Workbook();
            await restored.xlsx.load(buffer);
            const value = restored.getWorksheet("SecuritySmoke")?.getCell("A1").value;
            if (value !== "FutureHR") throw new Error("ExcelJS secure override smoke test failed");
            console.log("ExcelJS secure override smoke test passed");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Production build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: FutureHR V1 E2E
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: futurehr-playwright-report
          path: frontend/playwright-report
          retention-days: 7

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile SaaS backend
        run: python -m compileall -q core db routers
      - name: Backend security, tenant and decision intelligence tests
        env:
          ENVIRONMENT: test
          APP_ENV: test
        run: >-
          pytest -q
          tests/test_saas_security.py
          tests/test_production_readiness.py
          tests/test_employee_saas_api.py
          tests/test_saas_performance_talent.py
          tests/test_saas_workforce_ops.py
          tests/test_decision_intelligence_v2.py
          tests/test_recruitment_lifecycle_v2.py
          tests/unit/test_roles_permissions.py
          tests/integration/test_org_chart_endpoint.py
