name: FutureHR V1 Quality Gate

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Strict dependency security audit
        run: npm audit --audit-level=low
      - name: Verify hardened dependency graph
        run: npm ls axios jspdf next uuid tmp
      - name: ExcelJS compatibility smoke test
        run: |
          node <<'NODE'
          const ExcelJS = require("exceljs");
          (async () => {
            const workbook = new ExcelJS.Workbook();
            const sheet = workbook.addWorksheet("SecuritySmoke");
            sheet.getCell("A1").value = "FutureHR";
            const buffer = await workbook.xlsx.writeBuffer();
            const restored = new ExcelJS.Workbook();
            await restored.xlsx.load(buffer);
            const value = restored.getWorksheet("SecuritySmoke")?.getCell("A1").value;
            if (value !== "FutureHR") throw new Error("ExcelJS secure override smoke test failed");
            console.log("ExcelJS secure override smoke test passed");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: FutureHR V1 E2E
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: futurehr-playwright-report
          path: frontend/playwright-report
          retention-days: 7
