name: Export Main Source

on:
  push:
    branches:
      - export/main-source-20260830

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Create source archive
        run: git archive --format=zip --output=FutureHR_GitHub_main_2026-08-30.zip HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v5
        with:
          name: FutureHR-GitHub-main-2026-08-30
          path: FutureHR_GitHub_main_2026-08-30.zip
          compression-level: 0
          retention-days: 1
