name: Refresh fflate lock

on:
  push:
    branches:
      - security/fflate-083
    paths:
      - .github/workflows/refresh-fflate-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: security/fflate-083
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch fflate lock to 0.8.3
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          const entry = lock.packages?.['node_modules/fflate'];
          if (!entry) throw new Error('node_modules/fflate lock entry not found');
          entry.version = '0.8.3';
          entry.resolved = 'https://registry.npmjs.org/fflate/-/fflate-0.8.3.tgz';
          entry.integrity = 'sha512-tbZNuJrLwGUp3zshBtdy4W+ORxZuIh8a5ilyIEQDC5rY1f3U20JMry0Ll3WBzU58EZKsEuJFXhb5gwv8CsPvgA==';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Install exact lockfile
        run: npm ci --ignore-scripts
      - name: Verify fflate patched version
        run: |
          npm ls fflate
          node -e "const v=require('./node_modules/fflate/package.json').version; if (v !== '0.8.3') { console.error('Expected fflate 0.8.3, got '+v); process.exit(1) }"
      - name: Verify audit
        run: npm audit --audit-level=low
      - name: Commit verified lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "fix(security): update fflate to 0.8.3"
          git push origin HEAD:security/fflate-083
