name: Refresh fflate lock

on:
  push:
    branches:
      - security/fflate-083
    paths:
      - .github/workflows/refresh-fflate-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: security/fflate-083
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply npm security fix to lockfile
        run: npm audit fix --package-lock-only
      - name: Install exact lockfile
        run: npm ci
      - name: Verify fflate safe version
        run: npm ls fflate
      - name: Verify audit
        run: npm audit --audit-level=low
      - name: Commit verified lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "fix(security): update fflate to patched lock version"
          git push origin HEAD:security/fflate-083
