name: Verify fflate audit on macOS

on:
  push:
    branches:
      - security/fflate-083
    paths:
      - .github/workflows/audit-fflate-macos.yml

jobs:
  dependency-audit:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: security/fflate-083
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact lockfile without audit side effects
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify fflate 0.8.3
        run: |
          npm ls fflate
          node -e "const v=require('./node_modules/fflate/package.json').version; if (v !== '0.8.3') process.exit(1)"
      - name: Strict npm audit with bounded retries
        run: |
          python3 - <<'PY'
          import subprocess, sys, time
          for attempt in range(1, 6):
              print(f'npm audit attempt {attempt}/5', flush=True)
              try:
                  result = subprocess.run(['npm', 'audit', '--audit-level=low'], timeout=90)
                  if result.returncode == 0:
                      sys.exit(0)
              except subprocess.TimeoutExpired:
                  print('npm audit timed out; retrying', flush=True)
              if attempt < 5:
                  time.sleep(15)
          sys.exit(1)
          PY
