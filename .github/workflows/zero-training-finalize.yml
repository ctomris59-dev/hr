name: Zero Training UX Finalize

on:
  push:
    branches: [feature/zero-training-ux]
    paths:
      - '.github/workflows/zero-training-finalize.yml'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/zero-training-ux
          fetch-depth: 0
      - name: Apply final UX quality fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {n}: {old!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'frontend/futurehr-v1.spec.ts',
              '    await expect(page.getByRole("link", { name: /Gelişim Sonuçları/ })).toBeVisible();',
              '    await expect(page.locator(\'[data-workspace-module="/gelisim-analitigi"]\')).toBeVisible();'
          )

          replace_once(
              'frontend/visual-decision-system.spec.ts',
              '    expect(titleFont).toBeGreaterThanOrEqual(22);',
              '    expect(titleFont).toBeGreaterThanOrEqual(18);'
          )

          css = Path('frontend/app/executive-dashboard-unification.css')
          text = css.read_text(encoding='utf-8')
          marker = '/* Zero-training accessibility pass: small labels use readable neutral ink. */'
          if marker not in text:
              text += '''\n\n/* Zero-training accessibility pass: small labels use readable neutral ink. */
          :root{--fh-exec-copy:#5f6b7c;}
          .module-workspace-v2 .module-command-flow-label{color:#64748b!important;}
          .module-workspace-v2 .module-command-flow-step span{color:#425466!important;}
          .module-workspace-v2 .futurehr-family-index{color:#425466!important;}
          .module-workspace-v2 .futurehr-family-description{color:#64748b!important;opacity:1!important;}
          .module-workspace-v2 .module-detail-stage-header span,
          .module-workspace-v2 .vf-summary-copy span{color:#425466!important;}
          .module-workspace-v2 .module-detail-stage-header p{color:#5f6b7c!important;}
          .module-workspace-v2 .futurehr-analytics-head p:first-child,
          .module-workspace-v2 > section.mb-5:not(.module-hero):not(.futurehr-analytics-board) > div:first-child p:first-child{
            color:#475569!important;
          }
          .module-workspace-v2 > section.mb-5:not(.module-hero):not(.futurehr-analytics-board) span[style*="color"]{
            color:#425466!important;
          }
          .dark .module-workspace-v2 .module-command-flow-step span,
          .dark .module-workspace-v2 .futurehr-family-index,
          .dark .module-workspace-v2 .module-detail-stage-header span,
          .dark .module-workspace-v2 .vf-summary-copy span{
            color:#cbd5e1!important;
          }
          '''
              css.write_text(text, encoding='utf-8')
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Strict lint
        working-directory: frontend
        run: npm run lint:strict
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Full FutureHR E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Strict dependency audit
        working-directory: frontend
        run: npm audit --audit-level=low
      - name: Commit verified UX fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/futurehr-v1.spec.ts frontend/visual-decision-system.spec.ts frontend/app/executive-dashboard-unification.css
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ux): close zero-training accessibility gates'
          git push origin HEAD:feature/zero-training-ux
