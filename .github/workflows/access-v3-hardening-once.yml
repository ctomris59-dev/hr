name: Access V3 Hardening Once
on:
  push:
    branches:
      - feature/permission-hierarchy-v3
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[access-v3-hardening]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/permission-hierarchy-v3
          fetch-depth: 0
      - name: Apply targeted hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          access = Path('frontend/lib/hr/accessControl.ts')
          text = access.read_text()
          text = text.replace('skillsGraph: "talent"', 'skillsGraph: "development"')
          text = text.replace(
              'if (!payload?.policy) return loadCompanyAccessPolicy();',
              'if (!payload?.policy) { saveCompanyAccessPolicy(DEFAULT_COMPANY_ACCESS_POLICY); return DEFAULT_COMPANY_ACCESS_POLICY; }'
          )
          access.write_text(text)

          workforce = Path('backend/routers/workforce_ops_v1.py')
          text = workforce.read_text()
          text = text.replace(
              'def _employee_view(employee: EmployeeModel) -> EmployeeOpsView:',
              'def _employee_view(employee: EmployeeModel, *, include_salary: bool = False) -> EmployeeOpsView:'
          )
          text = text.replace(
              '        salary_amount=employee.salary_amount,',
              '        salary_amount=employee.salary_amount if include_salary else None,',
              1,
          )
          text = text.replace(
              '    return CompensationWorkspace(\n        employees=[_employee_view(employee) for employee in employees],',
              '    return CompensationWorkspace(\n        employees=[_employee_view(employee, include_salary=True) for employee in employees],'
          )
          workforce.write_text(text)

          tests = Path('backend/tests/test_saas_workforce_ops.py')
          text = tests.read_text()
          marker = '    assert [row["id"] for row in workspace.json()["employees"]] == ["e1"]\n'
          addition = marker + '    assert workspace.json()["employees"][0]["salary_amount"] is None\n'
          if 'workspace.json()["employees"][0]["salary_amount"] is None' not in text:
              text = text.replace(marker, addition, 1)
          comp_marker = '    assert {"m1", "e1", "e2", "h1", "c1"}.issubset(ids)\n'
          comp_addition = comp_marker + '    assert next(row for row in workspace.json()["employees"] if row["id"] == "e1")["salary_amount"] == 10000\n'
          if 'next(row for row in workspace.json()["employees"] if row["id"] == "e1")["salary_amount"] == 10000' not in text:
              text = text.replace(comp_marker, comp_addition, 1)
          tests.write_text(text)
          PY
      - name: Commit hardening
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/hr/accessControl.ts backend/routers/workforce_ops_v1.py backend/tests/test_saas_workforce_ops.py
          git commit -m "fix(access): harden scope mapping and sensitive response redaction [access-v3-hardening]"
          git push origin HEAD:feature/permission-hierarchy-v3
