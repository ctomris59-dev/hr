[pytest]
# Pytest configuration for FastAPI backend
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use real dependencies)
    slow: Slow tests that take more than 1 second

