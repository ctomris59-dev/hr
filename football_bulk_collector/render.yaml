services:
  - type: web
    name: football-dataset-export
    runtime: python
    plan: free
    region: frankfurt
    branch: football-data-collector
    rootDir: football_bulk_collector
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn export_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: football-dataset-db
          property: connectionString
      - key: DOWNLOAD_TOKEN
        generateValue: true

  - type: cron
    name: football-bulk-collector
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    branch: football-data-collector
    rootDir: football_bulk_collector
    schedule: "0 3 1 1 *"
    buildCommand: pip install -r requirements.txt
    startCommand: python collector.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: football-dataset-db
          property: connectionString
      - key: API_FOOTBALL_KEY
        sync: false
      - key: SEASONS
        value: "2024,2025"
      - key: DAILY_REQUEST_RESERVE
        value: "20"

databases:
  - name: football-dataset-db
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: football_dataset
    user: football_dataset
    ipAllowList: []
