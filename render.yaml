services:
  - type: web
    name: hr-system-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATA_MODE
        value: database
      - key: SAAS_AUTH_ENABLED
        value: "true"
      - key: ALLOW_LEGACY_API_IN_SAAS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: '["hr-system-backend.onrender.com"]'
      - key: CORS_ORIGINS
        value: '["https://hr-hibemotoru.vercel.app","https://hr-git-main-hibemotoru.vercel.app"]'
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: ACCESS_TOKEN_MINUTES
        value: "20"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_ECHO
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
